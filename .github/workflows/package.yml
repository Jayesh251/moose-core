name: Python package

on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build_wheel:
    runs-on: ${{ matrix.os }}    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, macos-15, windows-latest]
        build_type: [Release]
        c_compiler: [clang]
        python-version: ['3.11']
        # python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13','3.14']
    steps:
      - uses: actions/checkout@v4
        
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==3.3.0
        
      - name: MacOS dpendencies
        if: ${{ runner.os == 'macOS' }}
        run: |
          brew install gsl
          brew install hdf5          
      - name: Windows dependencies
        if: ${{ runner.os == 'Windows' }}
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: moose
          cache-environment: true
          cache-downloads: true
          create-args: >-
            python=${{ matrix.python-version }}
            pkg-config
            clang
            hdf5
            pybind11[global]
            graphviz
            pytables
            numpy
            matplotlib
            vpython
            lxml
            doxygen
            setuptools
            wheel
            meson
            ninja
            meson-python
            gsl
            libblas=*=*openblas
            cibuildwheel
          post-cleanup: all
          generate-run-shell: false            

      - name: Linux package
        if: runner.os == 'Linux'
        env:
          CIBW_BUILD_VERBOSITY: 1
          CIBW_BEFORE_ALL: 'uname -a'
          CIBW_BEFORE_ALL_LINUX: >
            yum install -y epel-release &&
            yum install -y pkgconfig &&
            yum install -y gsl-devel &&
            yum install -y hdf5-devel
          CIBW_BUILD: '*-manylinux_x86_64'
          CIBW_SKIP: 'pp* *t-*'
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_PYPY_X86_64_IMAGE: manylinux_2_28          
        run: |
          python -m cibuildwheel --output-dir wheelhouse
          ls wheelhouse
      - name: MacOS package
        if: runner.os == 'macOS'
        env:
          CIBW_BUILD_VERBOSITY: 1
          CIBW_BEFORE_ALL: 'uname -a'
          CIBW_BEFORE_ALL_MACOS: >
            brew uninstall pkg-config || :
              brew uninstall pkg-config@0.29.2 || :
                brew install gsl hdf5 meson ninja cmake &&
            export PKG_CONFIG=`which pkg-config` &&
            echo "<<<<<<<<<#########################################>>>>>>>>>>" &&
            echo "$$$$$ `pkg-config --libs gsl`" &&
            echo "@@@@@ `pkg-config --cflags gsl`"
          CIBW_ARCHS: 'arm64'
          CIBW_BUILD: '*-macosx_arm64'
          CIBW_SKIP: 'pp* cp38* *t-*'
        run: |
          export "MACOSX_DEPLOYMENT_TARGET=$(echo ${{ matrix.os }} | cut -c 7-8).0"  # required because gsl2.8 has minimum target of 14.0
          python -m cibuildwheel --output-dir wheelhouse
          ls wheelhouse
      - name: Windows package
        if: runner.os == 'Windows' 
        env:
          CIBW_BEFORE_ALL: 'uname -a'
          CIBW_BUILD: '*-win_*'
          CIBW_SKIP: '*-win32 pp* *t-* cp315-*'
        run: |
          micromamba shell hook -s powershell | Out-String | Invoke-Expression
          micromamba activate moose
          python -m cibuildwheel --output-dir wheelhouse
          dir wheelhouse
      - name: Keep wheels for testing
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
      - name: Upload packages
        if: github.ref == 'refs/heads/master'
        uses: xresloader/upload-to-github-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: "wheelhouse/pymoose*.whl"
#      - name: Set up Python (for Twine)
#        uses: actions/setup-python@v5
#        with:
#         python-version: '3.11'
#      - name: Upload to PyPI
#        if: always()
#        env:
#          TWINE_USERNAME: __token__  # Use __token__ as the username
#          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}  # Use the secret with your PyPI token as the password
#        run: |
#          python -m pip install --upgrade twine  # Ensure Twine is installed again
#          python -m twine --version  # Debug: Check Twine version
#          which python  # Debug: Ensure Python is available
#         which twine  # Debug: Check if Twine is correctly installed
#          python -m twine upload wheelhouse/*.whl  # Upload the built wheels to PyPI

  test_wheel_conda:
    # cibuildwheel's test-command imports with a python.org Python. The
    # 5.0.0 macOS wheels passed that but failed to import under a conda
    # Python, so also test the built wheels there.
    needs: build_wheel
    name: test conda / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, macos-15, windows-latest]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: wheelhouse
          merge-multiple: true
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.12'
          channels: conda-forge
          conda-remove-defaults: 'true'
      - name: Install the built wheel and import it
        run: |
          python -m pip install --no-index --find-links wheelhouse --no-deps pymoose
          python -m pip install pymoose --find-links wheelhouse
          python -c "import moose; moose.Compartment('/c'); print('moose', moose.__version__)"
